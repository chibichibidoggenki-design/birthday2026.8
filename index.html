<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Puzzle 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="game" class="card">
      <div class="progress" id="progress"></div>
      <h1 id="title"></h1>
      <p id="message" class="message"></p>
      <img id="puzzleImage" class="puzzle-image" alt="">
      <div id="question" class="question"></div>

      <div id="answerArea" class="answer-area">
        <input id="answer" type="text" autocomplete="off" placeholder="答えを入力してね">
        <button id="submit">答える</button>
        <p id="result" class="result" aria-live="polite"></p>
      </div>
    </section>

    <section id="complete" class="card hidden">
      <img src="8835e7c1-9b7c-407e-bd6a-e1d01dc87da7.png" class="puzzle-image" alt="Birthday Party">
      <h1>🎉 おめでとう！ 🎉</h1>
      <p class="message">みんながパーティーに集まったよ！</p>
      <p class="message">素敵な31歳の1年間になりますように</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
